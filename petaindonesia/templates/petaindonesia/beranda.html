<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WebGIS Django - Praktikum 7 SIG</title>
    <style>
      body {
        margin: 0;
        font-family: system-ui, sans-serif;
        background: #f3f6fa;
        color: #1b2733;
      }
      header {
        box-sizing: border-box;
        min-height: 44px;
        display: flex;
        align-items: center;
        padding: 0 16px;
        background: #1f4e79;
        color: #fff;
      }
      header h1 {
        margin: 0;
        font-size: 20px;
      }
      main {
        max-width: 720px;
        margin: 0 auto;
        padding: 24px 16px 40px;
      }
      main > p {
        margin: 0 0 20px;
        color: #4a5866;
        line-height: 1.5;
      }
      ul {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        gap: 10px;
      }
      a.kartu {
        display: block;
        padding: 14px 16px;
        background: #fff;
        border: 1px solid #cfd8e3;
        border-radius: 6px;
        color: inherit;
        text-decoration: none;
      }
      a.kartu:hover,
      a.kartu:focus-visible {
        border-color: #1f4e79;
        box-shadow: 0 1px 5px rgba(0, 0, 0, 0.15);
      }
      .url {
        font-family: ui-monospace, Consolas, monospace;
        font-size: 13px;
        color: #1f4e79;
      }
      .judul {
        display: block;
        margin: 2px 0;
        font-weight: 600;
      }
      .isi {
        font-size: 14px;
        color: #4a5866;
      }
      footer {
        margin-top: 24px;
        font-size: 13px;
        color: #4a5866;
      }
      footer a {
        color: #1f4e79;
      }
    </style>
  </head>
  <body>
    <header><h1>WebGIS Django - Praktikum 7 SIG</h1></header>
    <main>
      <p>
        Aplikasi WebGIS dengan Django, Leaflet.js, dan OpenStreetMap. Pilih
        halaman di bawah.
      </p>
      <ul>
        {% for h in halaman %}
        <li>
          <a class="kartu" href="{{ h.url }}">
            <span class="url">{{ h.url }}</span>
            <span class="judul">{{ h.judul }}</span>
            <span class="isi">{{ h.isi }}</span>
          </a>
        </li>
        {% endfor %}
      </ul>
      <footer>
        Data gempa: <a href="https://data.bmkg.go.id/gempabumi/">BMKG</a>. Peta
        dasar: &copy; OpenStreetMap contributors.
      </footer>
    </main>
  </body>
</html>
